# Inkling-2-Small TP4 on our 4 Sparks (recipe: ~/recipe-db/inkling2-sparks @ v0.3, swbiggart/inkling2-sparks)
# Adapted to OUR fabric: one QSFP port/host (cage 1) = two PCIe halves, enp1s0f1np1 (10.73.0.x) + enP2p1s0f1np1 (10.74.0.x),
# 100G per half, MTU 9000, RoCE GID 3. The recipe default is cage 0 @ 200G on 198.18.x.
# Rank order: spark3 is head (rank 0, serves HTTP). ssh names = the Mac's ~/.ssh/config aliases.
HOSTS=(spark3 spark1 spark2 spark4)
ROOT=/var/tmp/inkling2-tp4
RELEASE=/Users/agent/recipe-db/inkling2-sparks/_release/tensorfold-inkling2-tp4-v0.3-aarch64-sm121.tar.gz
RELEASE_SHA256=27fe1df93f4a28e67c7fee44e47ee57f3e121e407eac99adeafefd2fd1bd069d
# full checkpoint merged on spark2 (spark1's half rsynced over 10.73.0.x); setup.sh hash-checks it against the pinned revision
CHECKPOINT=spark2:/home/spark2/models/Inkling-2-Small
FABRIC_DEVS=(enp1s0f1np1 enP2p1s0f1np1)
FABRIC_HCAS=(rocep1s0f1 roceP2p1s0f1)
FABRIC_SPEED=100000
FABRIC_MTU=9000
FABRIC_GID=3
NCCL_PORT=29551
SOCKET_IFNAME=enp1s0f1np1
MASTER=10.73.0.3
# SAME URL + NAME as the glm53-tp4 lane: spark3 :8888, model id GLM-5.3-Flash-EXL3 (consumer contract, no Hermes repoint)
HTTP_HOST=0.0.0.0
HTTP_PORT=8888
EXTRA_ARGS="--name GLM-5.3-Flash-EXL3"
OPT_ENV=()
CONTEXT=262144   # the owner 2026-11-23: 256k (release default 131072)
