# Written by setup.sh from our-sparks.conf at 2026-11-24T05:39:09Z; release commit 9f1fd48a1. setup.sh rewrites it,
# so change our-sparks.conf and rerun `setup.sh our-sparks.conf config`. Format: config.example.sh.
HOSTS=( spark3 spark1 spark2 spark4 )
# NCCL's bootstrap (NCCL_COMM_ID) and the liveness lines (NCCL_PORT + 1) at rank 0's fabric address, and NCCL's
# sockets on the fabric port: a firewall on the LAN cannot drop them.
MASTER=10.73.0.3
NCCL_PORT=29551
SOCKET_IFNAME=enp1s0f1np1
ROOT=/var/tmp/inkling2-tp4
BIN="$ROOT/bin/tensorfold-native"
DECODE_BIN="$ROOT/bin/tf-inkling2-decode"
MODEL=/var/tmp/inkling2-tp4/model-split
LIBS="$ROOT/lib"
PLAN="$ROOT/plan"
DATA="$ROOT/data"
GRAPH=""
RUN="$ROOT/serve"
HTTP_HOST=0.0.0.0
HTTP_PORT=8888
EXTRA_ARGS=--name\ GLM-5.3-Flash-EXL3
# The release settings are release-defaults.sh's (rank.sh reads it first); only HOSTS_CONF's overrides follow.
FABRIC_DEVS=( enp1s0f1np1 enP2p1s0f1np1 )
FABRIC_HCAS=( rocep1s0f1 roceP2p1s0f1 )
FABRIC_SPEED=100000
FABRIC_MTU=9000
FABRIC_GID=3
NCCL_ENV=(
  NCCL_IB_DISABLE=0
  NCCL_IB_HCA=rocep1s0f1\,roceP2p1s0f1
  NCCL_IB_GID_INDEX=3
  NCCL_IB_MERGE_NICS=0
  NCCL_CROSS_NIC=1
  NCCL_IB_SUBNET_AWARE_ROUTING=1
  NCCL_IB_SUBNET_PREFIX_LEN=24
  NCCL_ALGO=Ring
  NCCL_CUMEM_ENABLE=1
  NCCL_RUNTIME_CONNECT=1
  NCCL_P2P_DISABLE=1
  NCCL_SHM_DISABLE=1
  NCCL_MIN_NCHANNELS=4
  NCCL_MAX_NCHANNELS=4
  NCCL_DEBUG=WARN
)
# Extra environment (OPT_ENV in HOSTS_CONF), the same on all four ranks; it comes after the release's settings.
EXTRA_ENV=(
)
IMAGE=inkling2-sparks:9f1fd48a1
CONTAINER=0
